name: Build & Draft Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签（如 v0.1.0）"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: ch-phi-rust.exe
            asset: ch-phi-rust-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: ch-phi-rust
            asset: ch-phi-rust-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v4

      # cpal 依赖 ALSA，winit 依赖 X11/Wayland 开发库。
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxcb1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          Compress-Archive
          -Path "target/${{ matrix.target }}/release/${{ matrix.bin }}"
          -DestinationPath "${{ matrix.asset }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: >
          tar -czf "${{ matrix.asset }}"
          -C "target/${{ matrix.target }}/release"
          "${{ matrix.bin }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # macOS：分别构建 arm64 与 x86_64，再用 lipo 合成 universal2 单包，兼容 Intel 与 Apple Silicon。
  macos:
    name: Build (macos-universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - name: Build (arm64)
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Build (x86_64)
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/ch-phi-rust \
            target/x86_64-apple-darwin/release/ch-phi-rust \
            -output ch-phi-rust
          lipo -info ch-phi-rust

      - name: Package
        run: tar -czf ch-phi-rust-macos-universal.tar.gz ch-phi-rust

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ch-phi-rust-macos-universal.tar.gz
          path: ch-phi-rust-macos-universal.tar.gz
          if-no-files-found: error

  release:
    name: Draft release
    needs: [build, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 标签优先级：手动输入 > tag 推送 > Cargo.toml 中的 version。
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
            tag="v${version}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: dist/*
